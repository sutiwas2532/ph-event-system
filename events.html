<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เลือกงาน — Professor Healthcare Event System</title>
<meta name="theme-color" content="#FAF8F3">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--navy:#224269;--ink:#1C2B3A;--line:#E5DFD2;--cream:#FAF8F3;--indigo:#4338CA;--indigo-line:rgba(67,56,202,.12);--r:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun',sans-serif;background:var(--cream);color:var(--ink);font-size:16px;min-height:100dvh}
h1,h2{font-family:'Bai Jamjuree','Sarabun',sans-serif}
button{font-family:inherit;cursor:pointer;border:none}
header{padding:1.4rem 1.15rem 1rem}
header .accent{font-family:'Instrument Serif',serif;font-style:italic;color:var(--indigo);font-size:1.1rem}
header h1{font-size:clamp(1.4rem,5vw,1.9rem);margin-top:.15rem}
header p{color:#6B6455;font-size:.92rem;margin-top:.4rem}
main{max-width:640px;margin:0 auto;padding:.4rem 1.15rem 2rem}
@media(min-width:700px){main{max-width:820px}}
@media(min-width:1024px){main{max-width:980px}}
.grid{display:grid;grid-template-columns:1fr;gap:.8rem;margin-top:.8rem}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{display:block;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;text-decoration:none;color:inherit;transition:border-color .15s}
.card:hover{border-color:var(--indigo)}
.card b{font-size:1.08rem;line-height:1.4;display:block;color:var(--ink)}
.card small{color:#6B6455;font-size:.85rem;display:block;margin-top:.4rem;line-height:1.5}
.card .cnt{margin-top:.7rem;font-size:.82rem;color:var(--indigo);font-weight:600}
.empty{padding:3rem 1rem;text-align:center;color:#8A8272;background:#fff;border:1.5px dashed var(--line);border-radius:var(--r);margin-top:.8rem}
.hint{font-size:.82rem;color:#8A8272;margin-top:1.2rem;line-height:1.6}
.hint a{color:var(--indigo);font-weight:600;text-decoration:none}
.skel{background:linear-gradient(90deg,#F1EEE5 25%,#F8F6F0 37%,#F1EEE5 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;height:1rem}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
</style>
</head>
<body>
<header>
  <div class="accent">Professor Healthcare</div>
  <h1>เลือกงานที่จะเช็คอิน</h1>
  <p>แตะเลือกงานด้านล่างเพื่อเข้าสู่หน้าลงทะเบียน/เช็คอินของงานนั้น</p>
</header>
<main>
  <div class="grid" id="grid">
    <div class="skel" style="height:120px"></div>
    <div class="skel" style="height:120px"></div>
  </div>
  <p class="hint">เป็นผู้จัดงาน? <a href="admin.html">ไปหน้าแอดมิน</a> เพื่อสร้างหรือจัดการงาน</p>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  let list = [];
  try {
    const r = await fetch('/api/events-summary', { cache:'no-store' });
    if (r.ok) list = await r.json();
  } catch(e){}
  if (!list.length) {
    $('grid').innerHTML = '<div class="empty">ยังไม่มีงานในระบบ<br><small>ผู้จัดงานสามารถสร้างงานใหม่ได้จากหน้าแอดมิน</small></div>';
    return;
  }
  $('grid').innerHTML = list.map(e => {
    const pct = e.total ? Math.round(e.checked / e.total * 100) : 0;
    return '<a class="card" href="index.html?event=' + encodeURIComponent(e.id) + '">'
      + '<b>' + esc(e.name) + '</b>'
      + '<small>' + esc([e.date, e.venue].filter(Boolean).join(' · ')) + '</small>'
      + '<div class="cnt">เช็คอินแล้ว ' + e.checked + ' / ' + e.total + ' คน (' + pct + '%)</div>'
      + '</a>';
  }).join('');
}
load();
setInterval(load, 8000);
</script>
</body>
</html>
