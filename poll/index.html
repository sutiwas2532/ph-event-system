<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#700018">
<title>Live Poll</title>
<style>
:root{
  --cr-900:#5c0012; --cr-800:#700018; --cr-700:#880019; --cr-600:#a3122c;
  --red:#c02a3a; --rose:#cd3c4e; --pink:#d9808d; --cream:#f2eee6;
  --ink:#141414; --ink-2:#3a3a3a; --muted:#7a716d; --line:#ece6e1; --track:#f4efea; --bg:#f7f3f0;
  --live:#2fbf71; --warn:#e8a33d;
  --font:Arial,"Helvetica Neue",Helvetica,"Noto Sans Thai",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit}

header{position:relative;overflow:hidden;color:#fff;padding:22px 20px 58px;padding-top:max(22px,env(safe-area-inset-top));
  background:radial-gradient(130% 120% at 15% 20%,#95102c 0%,#7a0017 45%,#5a0011 100%)}
header .orb{position:absolute;border-radius:50%;pointer-events:none}
header .big{width:250px;height:250px;right:-150px;top:-46px;
  background:radial-gradient(circle at 44% 50%,#b3112c 0%,#c4223b 20%,#d2526a 40%,#e9a4ae 58%,#fbe3e4 72%,rgba(255,250,249,.95) 79%,rgba(255,255,255,0) 81%)}
header .sm{width:30px;height:30px;right:30px;top:126px;
  background:radial-gradient(circle at 34% 30%,#fff 0%,#f9dfe2 18%,#e39aa5 45%,#b81f38 78%,#8a0b22 100%);box-shadow:0 6px 18px rgba(40,0,8,.35)}
header svg{position:absolute;inset:0;width:100%;height:100%}
.hd{position:relative;z-index:2;max-width:520px;margin:0 auto}
.toprow{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#f3c9cf;font-weight:700}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#f3d6da;font-weight:700;background:rgba(0,0,0,.18);padding:5px 9px;border-radius:20px}
.conn i{width:7px;height:7px;border-radius:50%;background:#aaa}
.conn.live i{background:var(--live)} .conn.warn i{background:var(--warn)}
h1{font-size:27px;line-height:1.08;font-weight:800;margin-top:12px;letter-spacing:-.3px;max-width:250px}
h1 .grad{background:linear-gradient(90deg,#fff 0%,#f7d8d3 60%,#f0b9b7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hsub{font-size:13px;font-weight:300;color:#fbe3e6;margin-top:8px;max-width:235px;line-height:1.35}

main{flex:1;width:100%;max-width:520px;margin:-38px auto 0;padding:0 14px 120px;position:relative;z-index:3}
.card{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(60,0,15,.10),0 1px 0 rgba(60,0,15,.04);padding:22px 20px 22px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qlabel{font-size:26px;font-weight:700;color:var(--red);line-height:1}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:13px;border:1.5px solid var(--cr-800);color:var(--cr-800);font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap}
.status{font-size:12px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:7px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none}
.status.closed i{background:#c9bdb9}
.case{background:#faf6f2;border-left:4px solid var(--cr-800);border-radius:4px 12px 12px 4px;padding:14px 14px 14px 16px;margin-top:16px}
.case-h{font-size:14px;font-weight:700;color:var(--cr-800);letter-spacing:.2px}
.case p{font-size:15px;line-height:1.45;margin-top:5px}
.case ul{list-style:none;margin-top:8px;display:grid;gap:6px}
.case li{font-size:14.5px;color:var(--ink-2);display:flex;gap:9px;align-items:center}
.case li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rose);flex:none}
.prompt{font-size:19px;font-weight:700;line-height:1.3;margin-top:16px;letter-spacing:-.1px}
.sub{font-size:16px;color:var(--ink-2);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:left;font-size:16px;line-height:1.3;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt .b{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:all .15s}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,#fff);box-shadow:inset 4px 0 0 var(--c)}
.opt.sel .b{background:var(--c);border-color:var(--c);color:#fff}
.opt[disabled]{opacity:.55;cursor:default}
.note{margin-top:14px;font-size:13.5px;line-height:1.45;color:var(--ink-2);background:#f3f9f5;border:1px solid #cfe9da;border-radius:12px;padding:11px 13px;display:none}
.note.on{display:block}
.note b{color:#1d7a48}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(247,243,240,0),var(--bg) 35%)}
.dock .in{max-width:520px;margin:0 auto}
.submit{width:100%;height:56px;border:0;border-radius:16px;background:var(--cr-800);color:#fff;font-size:17px;font-weight:700;letter-spacing:.2px;box-shadow:0 10px 24px rgba(112,0,24,.28);transition:opacity .2s,background .2s}
.submit[disabled]{opacity:.38;box-shadow:none}
.submit.done{background:#1f8a52;box-shadow:0 10px 24px rgba(31,138,82,.25)}

.res{margin-top:18px}
.res-h{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:16px}
.res-h b{font-size:15px}
.res-h span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.res-h span i{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block}
.rb{margin-top:13px}
.rb .row{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.3}
.rb .l{flex:none;font-weight:800;color:var(--c);width:16px}
.rb .t{flex:1}
.rb .v{font-weight:800;color:var(--ink-2);font-size:15px}
.rb .trk{height:12px;border-radius:6px;background:var(--track);margin:7px 0 0 26px;overflow:hidden}
.rb .f{height:100%;width:0;border-radius:6px;background:var(--c);opacity:.85;transition:width .7s cubic-bezier(.22,.8,.24,1)}
.rb.lead .f{opacity:1}
.rb.lead .v{color:var(--c)}
.rb.mine .t::after{content:"Your answer";margin-left:8px;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--cr-800);background:#f6e3e5;padding:2px 6px;border-radius:6px;vertical-align:2px}

.wait{text-align:center;padding:12px 4px 6px}
.wait h2{font-size:22px;margin-top:4px}
.wait p{font-size:15px;line-height:1.5;color:var(--ink-2);margin-top:10px}
.pulse{display:inline-flex;gap:7px;margin-top:22px}
.pulse i{width:9px;height:9px;border-radius:50%;background:var(--cr-800);animation:bl 1.2s infinite ease-in-out}
.pulse i:nth-child(2){animation-delay:.2s}.pulse i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.waitlbl{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:10px;font-weight:700}
.hcp{text-align:center;font-size:11px;color:#a59a96;margin-top:18px;line-height:1.5}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-20px);background:#2a0a10;color:#fff;font-size:14px;padding:11px 16px;border-radius:12px;z-index:30;opacity:0;transition:all .3s;max-width:90%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.demo{display:none;text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 400 200" preserveAspectRatio="none"><g fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"><circle cx="380" cy="80" r="170"/><path d="M0 150 C 120 130, 260 160, 400 60"/></g></svg>
  <div class="orb big"></div><div class="orb sm"></div>
  <div class="hd">
    <div class="toprow"><span class="eyebrow">Live poll</span><span class="conn" id="conn"><i></i><span>Connecting</span></span></div>
    <h1>Rethinking <span class="grad">Recurrence</span> in CRSwNP</h1>
    <div class="hsub">From Eosinophilic Inflammation to Targeted Intervention</div>
  </div>
</header>

<main>
  <div class="card" id="card">
    <div class="wait"><div class="pulse"><i></i><i></i><i></i></div><div class="waitlbl">Connecting</div></div>
  </div>
  <div class="demo" id="demo">Preview mode &middot; not connected to the poll server</div>
  <div class="hcp">For healthcare professionals only.<br>Responses are anonymous.</div>
</main>

<div class="dock" id="dock" style="display:none"><div class="in"><button class="submit" id="submit" disabled>Submit answer</button></div></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var QUESTIONS = [
  { caseText:{ title:'Case Scenario', lead:'A 45-year-old patient with CRSwNP underwent ESS 11 months ago. Now presents with:',
      findings:['recurrent nasal polyps','persistent smell loss','blood eosinophils 600 cells/&micro;L','comorbid asthma'] },
    prompt:'What would be your next management?',
    options:['Continue topical steroid','Oral corticosteroids','Revision surgery','Biologic therapy','MDT discussion'] },
  { prompt:'After how many surgeries would you normally consider biologic therapy?',
    options:['Before first surgery','After first surgery','After second surgery','After &ge;3 surgeries','Depends on patient characteristics'] },
  { prompt:'Which biomarker do you most commonly use to assess Type 2 inflammation in CRSwNP?',
    options:['Blood eosinophil count','Total serum IgE','Tissue eosinophils','FeNO','I do not routinely assess Type 2 biomarker'] },
  { prompt:'What Should Be Our Treatment Goal?', sub:'Most important goal?',
    options:['Smaller polyps','Better SNOT-22','Less OCS','Prevent recurrence','Disease control/remission'] }
];
var N = QUESTIONS.length, LETTERS = 'ABCDEFGHIJ';
var COLORS = ['#1b2a7a','#c8102e','#0890b8','#d4541f','#5f9618','#6a2c91'];
var DEFAULT_POLL = 'nucala-crswnp';
var params = new URLSearchParams(location.search);
var POLL = (params.get('poll') || DEFAULT_POLL).replace(/[^A-Za-z0-9_-]/g,'') || DEFAULT_POLL;
var API = '/api/poll', Q = '?poll=' + encodeURIComponent(POLL);
var isHttp = /^https?:$/.test(location.protocol);
var LIVE_HOST = /(professorhealthcare\.com|proudtopresent\.net|workers\.dev|pages\.dev)$|^localhost$|^127\.0\.0\.1$/i.test(location.hostname);

function $(id){ return document.getElementById(id); }
var mem = {};
var store = {
  get:function(k){ try{ var v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : null) : v; }catch(e){ return k in mem ? mem[k] : null; } },
  set:function(k,v){ mem[k] = v; try{ localStorage.setItem(k,v); }catch(e){} }
};
var voter = store.get('pollVoterId');
if (!voter){ voter = 'v' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); store.set('pollVoterId', voter); }

var S = { idx:0, phase:null, round:'', counts:null, total:0, rev:-1 };
var mode = 'boot', selected = null, sending = false, rendered = '';
function voteKey(){ return 'pv:' + POLL + ':' + S.round + ':' + S.idx; }
function myVote(){ var v = store.get(voteKey()); return v === null ? null : +v; }
function sum(a){ var s=0; (a||[]).forEach(function(x){ s += x||0; }); return s; }

var toastT;
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, 2600); }
function setConn(st){
  var c=$('conn'); c.className='conn ' + (st==='live'?'live':st==='demo'?'':'warn');
  c.querySelector('span').textContent = st==='live'?'Live':st==='demo'?'Preview':st==='boot'?'Connecting':'Reconnecting';
}

/* ---------------- render ---------------- */
function render(){
  var open = S.phase === 'question' || S.phase === 'results';
  var key = (open ? 'open' : S.phase) + ':' + S.idx + ':' + S.round;
  var card = $('card');
  if (open){
    if (rendered !== key){ rendered = key; selected = myVote(); buildQuestion(card); }
    updateQuestion();
  } else {
    $('dock').style.display = 'none';
    if (rendered !== key){
      rendered = key;
      if (S.phase === 'end'){
        card.innerHTML = '<div class="wait"><div class="qlabel" style="font-size:22px">Thank you</div><h2>for taking part</h2>'
          + '<p>All questions are closed. Results are shown on the main screen.</p></div>';
      } else {
        card.innerHTML = '<div class="wait"><div class="qlabel" style="font-size:22px">You’re in</div><h2>Welcome</h2>'
          + '<p>The question will appear here automatically when the speaker opens the poll. Please keep this page open.</p>'
          + '<div class="pulse"><i></i><i></i><i></i></div><div class="waitlbl">Waiting for the speaker</div></div>';
      }
    }
  }
}
function buildQuestion(card){
  var q = QUESTIONS[S.idx]; if (!q) return;
  var h = '<div class="meta"><div class="qlabel">Question</div><span class="pill">' + (S.idx+1) + ' of ' + N + '</span></div>'
    + '<div class="status" id="status"><i></i><span>Voting is open</span></div>';
  if (q.caseText){
    h += '<div class="case"><div class="case-h">' + q.caseText.title + '</div><p>' + q.caseText.lead + '</p><ul>'
      + q.caseText.findings.map(function(f){ return '<li>' + f + '</li>'; }).join('') + '</ul></div>';
  }
  h += '<div class="prompt">' + q.prompt + '</div>' + (q.sub ? '<div class="sub">' + q.sub + '</div>' : '');
  h += '<div class="opts" id="opts">' + q.options.map(function(o,i){
    return '<button class="opt" data-k="' + i + '" style="--c:' + COLORS[i] + '"><span class="b">' + LETTERS[i] + '</span><span>' + o + '</span></button>'; }).join('') + '</div>';
  h += '<div class="note" id="note"><b>Answer received.</b> You can change it while this question is open.</div>';
  h += '<div class="res" id="res" style="display:none"><div class="res-h"><b>Live results</b><span><i></i><em id="resN" style="font-style:normal">0 responses</em></span></div><div id="resBars">'
    + q.options.map(function(o,i){ return '<div class="rb" data-k="' + i + '" style="--c:' + COLORS[i] + '"><div class="row"><span class="l">' + LETTERS[i] + '</span><span class="t">' + o
      + '</span><span class="v">0%</span></div><div class="trk"><div class="f"></div></div></div>'; }).join('') + '</div></div>';
  card.innerHTML = h;
  $('opts').onclick = function(e){
    var b = e.target.closest('.opt'); if (!b || sending) return;
    selected = +b.getAttribute('data-k');
    if (navigator.vibrate) try{ navigator.vibrate(8); }catch(err){}
    updateQuestion();
  };
  if (S.phase === 'question') scrollTo({ top:0, behavior:'smooth' });
}
function updateQuestion(){
  var mine = myVote();
  document.querySelectorAll('.opt').forEach(function(b){ b.classList.toggle('sel', +b.getAttribute('data-k') === selected); });
  $('note').classList.toggle('on', mine !== null && selected === mine);
  var btn = $('submit');
  btn.classList.remove('done');
  if (sending){ btn.disabled = true; btn.textContent = 'Sending…'; }
  else if (selected === null){ btn.disabled = true; btn.textContent = 'Select an answer'; }
  else if (mine === null){ btn.disabled = false; btn.textContent = 'Submit answer'; }
  else if (mine === selected){ btn.disabled = true; btn.textContent = 'Answer submitted'; btn.classList.add('done'); }
  else { btn.disabled = false; btn.textContent = 'Update answer'; }
  $('dock').style.display = (mine !== null && mine === selected && !sending) ? 'none' : '';
  var res = $('res');
  if (S.phase === 'results' && S.counts){
    res.style.display = '';
    var c = S.counts, t = sum(c), max = 0;
    c.forEach(function(v){ max = Math.max(max, v||0); });
    $('resN').textContent = t + (t === 1 ? ' response' : ' responses');
    document.querySelectorAll('.rb').forEach(function(r){
      var k = +r.getAttribute('data-k'), v = c[k] || 0, p = t ? Math.round(v*100/t) : 0;
      r.querySelector('.f').style.width = (t ? v*100/t : 0) + '%';
      r.querySelector('.v').textContent = p + '%';
      r.classList.toggle('lead', t > 0 && v === max);
      r.classList.toggle('mine', mine === k);
    });
    $('status').querySelector('span').textContent = 'Results are live — voting still open';
  } else {
    res.style.display = 'none';
    $('status').querySelector('span').textContent = 'Voting is open';
  }
}

/* ---------------- voting ---------------- */
$('submit').onclick = function(){
  if (selected === null || sending) return;
  var choice = selected, idx = S.idx, round = S.round;
  if (mode === 'demo'){ store.set(voteKey(), String(choice)); updateQuestion(); demoAfterVote(); return; }
  sending = true; updateQuestion();
  var attempt = 0;
  (function send(){
    fetch(API + '/vote' + Q, { method:'POST', headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({ q:idx, choice:choice, voter:voter, round:round }) })
      .then(function(r){ return r.json().then(function(d){ return { st:r.status, d:d }; }); })
      .then(function(x){
        sending = false;
        if (x.d && x.d.ok){
          store.set('pv:' + POLL + ':' + round + ':' + idx, String(choice));
          if (navigator.vibrate) try{ navigator.vibrate([10,40,10]); }catch(e){}
        } else if (x.st === 409){
          toast(x.d && x.d.error === 'stale_round' ? 'The poll was restarted. Please answer again.' : 'This question is now closed.');
          if (x.d && x.d.state) apply(x.d.state, true);
        } else { toast('Could not send your answer. Please try again.'); }
        updateQuestion();
      })
      .catch(function(){
        if (++attempt <= 2) return setTimeout(send, 900 * attempt);
        sending = false; updateQuestion(); toast('No connection. Please try again.');
      });
  })();
};

/* ---------------- live state ---------------- */
function apply(d, force){
  if (!d || d.t !== 'state') return;
  if (!force && typeof d.rev === 'number' && d.rev < S.rev) return;
  var changed = d.idx !== S.idx || d.phase !== S.phase || d.round !== S.round;
  S.idx = d.idx; S.phase = d.phase; S.round = d.round; S.rev = d.rev; S.total = d.total;
  S.counts = d.counts || null;
  if (changed) sending = false;
  render();
}
var ws = null, wsTries = 0, wsTimer = null, pollT = null, hbT = null;
function connectWS(){
  clearTimeout(wsTimer);
  var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + API + '/ws' + Q + '&role=aud';
  try { ws = new WebSocket(url); } catch(e){ return scheduleWS(); }
  ws.onopen = function(){ wsTries = 0; setConn('live'); stopPolling(); clearInterval(hbT); hbT = setInterval(function(){ try{ ws.send('ping'); }catch(e){} }, 25000); };
  ws.onmessage = function(e){ if (e.data === 'pong') return; try{ apply(JSON.parse(e.data)); }catch(err){} };
  ws.onclose = function(){ clearInterval(hbT); setConn('warn'); startPolling(); scheduleWS(); };
  ws.onerror = function(){ try{ ws.close(); }catch(e){} };
}
function scheduleWS(){ clearTimeout(wsTimer); wsTimer = setTimeout(connectWS, Math.min(10000, 800 * Math.pow(2, wsTries++))); }
function startPolling(){ if (pollT) return; pollT = setInterval(pollOnce, 3500); }
function stopPolling(){ clearInterval(pollT); pollT = null; }
function pollOnce(){
  fetch(API + '/state' + Q, { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(d){ apply(d); }).catch(function(){});
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && mode === 'live'){
    pollOnce();
    if (!ws || ws.readyState > 1) connectWS();
  }
});

function boot(){
  if (params.get('demo') === '1' || !isHttp || (!LIVE_HOST && params.get('live') !== '1')) return startDemo();
  setConn('boot');
  fetch(API + '/state' + Q, { cache:'no-store' })
    .then(function(r){ var ct = r.headers.get('content-type') || ''; if (!r.ok || ct.indexOf('json') < 0) throw { notReady:true }; return r.json(); })
    .then(function(d){ if (!d || d.t !== 'state') throw { notReady:true }; mode = 'live'; apply(d); connectWS(); })
    .catch(function(e){ if (e && e.notReady) return startDemo(); setConn('warn'); setTimeout(boot, 2500); });
}

/* ---------------- preview (no server) ---------------- */
function startDemo(){
  mode = 'demo'; setConn('demo'); $('demo').style.display = 'block';
  var i = Math.max(0, Math.min(N-1, (parseInt(params.get('q'),10) || 1) - 1));
  apply({ t:'state', idx:i, phase:'question', round:'demo', rev:0, total:0 }, true);
}
function demoAfterVote(){
  var base = [[3,4,10,38,18],[4,30,22,8,36],[55,14,22,6,3],[6,10,8,24,52]][S.idx] || [5,5,5,5,5];
  var mine = myVote(); var c = base.slice(); if (mine !== null) c[mine] += 1;
  setTimeout(function(){ apply({ t:'state', idx:S.idx, phase:'results', round:'demo', rev:0, total:sum(c), counts:c }, true); }, 600);
}

boot();
})();
</script>
</body>
</html>
